name: Deploy to IPFS

# Publishes the prerendered site to public IPFS (via Pinata) once CI passes on
# main. The CID printed in the job summary goes into the ENS contenthash of
# cpl121.eth as `ipfs://<CID>`, and eth.limo serves it at cpl121.eth.limo.
#
# Requires one repository secret:
#   PINATA_JWT  -> a Pinata API key JWT with the pinFileToIPFS scope
#                  (https://app.pinata.cloud -> API Keys -> New Key).
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skip the deploy cleanly (green, not red) until PINATA_JWT is configured,
  # so an unconfigured repo doesn't fail on every push to main.
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ -n "$PINATA_JWT" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '⏭️ Skipped: add a `PINATA_JWT` repository secret (Settings → Secrets and variables → Actions) to enable IPFS deploys.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build (confidentiality + sitemap)
        run: npm run verify:build

      - name: Pin to IPFS (Pinata)
        id: ipfs
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          CID="$(node scripts/pin-to-ipfs.mjs build | tail -n1)"
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      - name: Publish CID to job summary
        run: |
          CID='${{ steps.ipfs.outputs.cid }}'
          {
            echo '## 🛰️ Deployed to IPFS'
            echo ''
            echo "**CID:** \`$CID\`"
            echo ''
            echo '**Preview via gateway:**'
            echo "- https://$CID.ipfs.dweb.link/"
            echo "- https://ipfs.io/ipfs/$CID/"
            echo ''
            echo '### Publish this build'
            echo 'Set the `contenthash` of **cpl121.eth** to the value below at'
            echo '<https://app.ens.domains/cpl121.eth> (one signed transaction).'
            echo 'eth.limo then serves the new build at https://cpl121.eth.limo/'
            echo ''
            echo '```'
            echo "ipfs://$CID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
